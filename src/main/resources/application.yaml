spring:
  application:
    name: video-processing-pipeline
  task:
    execution:
      pool:
        core-size: 8
        max-size: 8
        queue-capacity: 100
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
  profiles:
    active: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

server:
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  ffmpeg:
    ffprobe-path: ffprobe
    ffmpeg-path: ffmpeg
  recovery:
    poll-interval: 60s
    pending-stale-after: 60s
    running-timeout: 300s
  storage:
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
    presign-endpoint: ${APP_STORAGE_PRESIGN_ENDPOINT:}
    # 플레이리스트 발급 시점에 모든 세그먼트 URL이 고정되므로, VOD 최대 재생 시간보다 길어야 한다
    presign-ttl: 4h
    bucket: videopipeline
    access-key: ${APP_STORAGE_ACCESS_KEY:minio}
    secret-key: ${APP_STORAGE_SECRET_KEY:localminio}