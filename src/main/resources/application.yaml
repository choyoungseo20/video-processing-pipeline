spring:
  application:
    name: video-processing-pipeline
  task:
    execution:
      pool:
        core-size: 8
        max-size: 8
        queue-capacity: 100
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
  profiles:
    active: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

server:
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  ffmpeg:
    ffprobe-path: ffprobe
  recovery:
    poll-interval: 60s
    pending-stale-after: 60s
    running-timeout: 60s
  storage:
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
    bucket: videopipeline
    access-key: ${APP_STORAGE_ACCESS_KEY:minio}
    secret-key: ${APP_STORAGE_SECRET_KEY:localminio}